  <script>
  (function(){
    /* ================================================================
       LMS FORM CONFIG: Apna WhatsApp number yahan set karein
       Country code ke saath, bina + / space ke likhein.
       Example: 919876543210
       ================================================================ */
    var LMS_WHATSAPP_NUMBER = "919504331353";

    function lmsField(icon, label, id, type, ph, val){
      return '<div>'
        + '<label for="'+id+'" style="display:block;font-size:12px;font-weight:700;color:#374151;margin-bottom:6px;">'+icon+' '+label+'</label>'
        + '<input id="'+id+'" type="'+type+'" placeholder="'+ph+'" value="'+(val||'')+'" autocomplete="off"'
        + ' style="width:100%;box-sizing:border-box;border:1.5px solid #e5e7eb;border-radius:12px;padding:12px 14px;font-size:14px;outline:none;transition:border-color .2s;background:#fff;color:#111;"'
        + ' onfocus="this.style.borderColor=\'#f97316\'" onblur="this.style.borderColor=\'#e5e7eb\'">'
        + '</div>';
    }

    window.__showLmsForm = function(){
      var old = document.getElementById('lms-form-overlay');
      if(old) old.remove();

      var districts = ["Araria","Arwal","Aurangabad","Banka","Begusarai","Bhagalpur","Bhojpur (Ara)","Buxar","Darbhanga","East Champaran","Gaya","Gopalganj","Jamui","Jehanabad","Kaimur","Katihar","Khagaria","Kishanganj","Lakhisarai","Madhepura","Madhubani","Munger","Muzaffarpur","Nalanda","Nawada","Patna","Purnia","Rohtas","Saharsa","Samastipur","Saran","Sheikhpura","Sheohar","Sitamarhi","Siwan","Supaul","Vaishali","West Champaran"];
      var dOpts = districts.map(function(d){ return '<option value="'+d+'">'; }).join('');

      var overlay = document.createElement('div');
      overlay.id = 'lms-form-overlay';
      overlay.style.cssText = 'position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:14px;overflow-y:auto;';

      overlay.innerHTML =
        '<div style="background:#ffffff;border-radius:20px;max-width:480px;width:100%;overflow:hidden;box-shadow:0 25px 60px rgba(0,0,0,.30);margin:auto;">'
        + '<div style="background:linear-gradient(135deg,#f97316 0%,#ea580c 100%);padding:22px 20px;color:#fff;text-align:center;">'
        + '<div style="font-size:38px;line-height:1;">\uD83D\uDCC4</div>'
        + '<div style="font-weight:800;font-size:18px;letter-spacing:1px;margin-top:8px;">AADHAR LMS CERTIFICATE</div>'
        + '<div style="font-size:12px;opacity:.92;margin-top:4px;">Operator Registration Form</div>'
        + '</div>'
        + '<div style="padding:20px;display:flex;flex-direction:column;gap:14px;">'
        + lmsField('\uD83D\uDD8A\uFE0F','Name','lms-name','text','Apna poora naam likhein','')
        + lmsField('\uD83D\uDCF1','Mobile Number','lms-mobile','tel','10 digit mobile number','')
        + lmsField('\uD83D\uDCE9','Email ID','lms-email','email','example@mail.com','')
        + lmsField('\uD83C\uDF0D','State','lms-state','text','State','Bihar')
        + '<div><label for="lms-district" style="display:block;font-size:12px;font-weight:700;color:#374151;margin-bottom:6px;">\uD83C\uDFD9\uFE0F District</label>'
        + '<input id="lms-district" list="lms-dist-list" placeholder="District chunein ya likhein" autocomplete="off"'
        + ' style="width:100%;box-sizing:border-box;border:1.5px solid #e5e7eb;border-radius:12px;padding:12px 14px;font-size:14px;outline:none;background:#fff;color:#111;"'
        + ' onfocus="this.style.borderColor=\'#f97316\'" onblur="this.style.borderColor=\'#e5e7eb\'">'
        + '<datalist id="lms-dist-list">'+dOpts+'</datalist></div>'
        + lmsField('\uD83D\uDD30','Aadhar Number','lms-aadhar','tel','12 digit Aadhar number','')
        + '<div id="lms-err" style="display:none;color:#b91c1c;font-size:12px;background:#fee2e2;border:1px solid #fecaca;border-radius:10px;padding:10px;"></div>'
        + '<button id="lms-submit" style="background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;border:none;border-radius:999px;padding:14px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(22,163,74,.35);">\uD83D\uDCF2 Submit via WhatsApp</button>'
        + '<button id="lms-cancel" style="background:#fff;border:1.5px solid #e5e7eb;border-radius:999px;padding:12px;font-size:13px;font-weight:600;color:#374151;cursor:pointer;">Cancel</button>'
        + '<div style="text-align:center;font-size:10px;color:#9ca3af;">Form submit hote hi WhatsApp khul jayega</div>'
        + '</div></div>';

      document.body.appendChild(overlay);

      function closeLms(){ overlay.remove(); }
      document.getElementById('lms-cancel').onclick = closeLms;
      overlay.addEventListener('click', function(e){ if(e.target===overlay) closeLms(); });

      function showErr(m){
        var el = document.getElementById('lms-err');
        el.style.display='block';
        el.textContent = '\u26A0\uFE0F ' + m;
        el.scrollIntoView({behavior:'smooth', block:'nearest'});
      }
      function val(id){ return document.getElementById(id).value.trim(); }

      document.getElementById('lms-submit').onclick = function(){
        var name = val('lms-name'),
            mobile = val('lms-mobile'),
            email = val('lms-email'),
            state = val('lms-state'),
            district = val('lms-district'),
            aadhar = val('lms-aadhar');
        var mob = mobile.replace(/\D/g,'');
        var adh = aadhar.replace(/\D/g,'');
        if(name.length < 2) return showErr('Naam sahi se likhein.');
        if(!/^[6-9]\d{9}$/.test(mob)) return showErr('Mobile number 10 digit ka hona chahiye (6-9 se shuru).');
        if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showErr('Email ID sahi likhein.');
        if(!state) return showErr('State likhein.');
        if(!district) return showErr('District chunein ya likhein.');
        if(!/^\d{12}$/.test(adh)) return showErr('Aadhar number 12 digit ka hona chahiye.');

        try{
          var arr = JSON.parse(localStorage.getItem('jssm_lms_regs')||'[]');
          arr.push({name:name,mobile:mob,email:email,state:state,district:district,aadhar:adh,date:new Date().toLocaleString('hi-IN')});
          localStorage.setItem('jssm_lms_regs', JSON.stringify(arr));
        }catch(e){}

        var msg = "\uD83D\uDCC4AADHAR LMS CERTIFICATE \uD83D\uDCC4\n"
          + "\uD83D\uDD8A\uFE0F Name : " + name + "\n"
          + "\uD83D\uDCF1Mobile Number : " + mob + "\n"
          + "\uD83D\uDCE9 Email ID : " + email + "\n"
          + "\uD83C\uDF0D State : " + state + "\n"
          + "\uD83C\uDFD9\uFE0F District : " + district + "\n"
          + "\uD83D\uDD30 Aadhar Number : " + adh;

        var waUrl = "https://api.whatsapp.com/send?phone=" + LMS_WHATSAPP_NUMBER + "&text=" + encodeURIComponent(msg);
        var waLink = document.createElement("a");
        waLink.href = waUrl;
        waLink.target = "_blank";
        waLink.rel = "noopener noreferrer";
        document.body.appendChild(waLink);
        waLink.click();
        setTimeout(function(){ try{ waLink.remove(); }catch(e){} }, 500);
        closeLms();
      };
    };
  })();
  </script>

          if(name.length < 2) return showErr('Naam sahi se likhein.');
          if(!/^[6-9]\d{9}$/.test(mob)) return showErr('Mobile number 10 digit ka hona chahiye (6-9 se shuru).');
          if(!post) return showErr('Name of Post chunein (Supervisor / Operator).');
          if(!district) return showErr('District chunein ya likhein.');
          try{
            var arr = JSON.parse(localStorage.getItem('jssm_vacancy_regs')||'[]');
            arr.push({name:name,mobile:mob,post:post,district:district,qual:qual,date:new Date().toLocaleString('hi-IN')});
            localStorage.setItem('jssm_vacancy_regs', JSON.stringify(arr));
          }catch(e){}
          var msg = "\uD83D\uDCBC VACANCY APPLICATION \uD83D\uDCBC\n"
            + "\uD83D\uDD8A\uFE0F Name : " + name + "\n"
            + "\uD83D\uDCF1 Mobile : " + mob + "\n"
            + "\uD83D\uDCBC Name of Post : " + post + "\n"
            + "\uD83C\uDFD9\uFE0F District : " + district + "\n"
            + "\uD83C\uDF93 Qualification : " + (qual||'-');
          var waUrl = "https://api.whatsapp.com/send?phone=" + VAC_WHATSAPP_NUMBER + "&text=" + encodeURIComponent(msg);
          var waLink = document.createElement("a");
          waLink.href = waUrl; waLink.target = "_blank"; waLink.rel = "noopener noreferrer";
          document.body.appendChild(waLink); waLink.click();
          setTimeout(function(){ try{ waLink.remove(); }catch(e){} }, 500);
          closeVac();
        };
      }catch(e){ console.log(e); }
    };
  })();
  </script>

    function openUidai(){

      else window.open(url, "_blank");
    }

    function handleNav(action){
      if(action==="status"){ openUidai(); }
      else if(action==="eid"){ openUidai(); }
      else if(action==="examreg"){ if(window.__showLmsForm) window.__showLmsForm(); }

        "Mujhe Pan India Enrollment Centre ki jaankari chahiye."); }

        "Mujhe New Enrollment Centre ke liye apply karna hai."); }
      else if(action==="vacancy"){ if(window.__showVacancyForm) window.__showVacancyForm(); }
      else if(action==="printportal"){ scrollToPrint(); }
    }

    function addHeaderNav(){
      if(document.getElementById('header-nav-strip')) return true;
      var header = document.querySelector('header');
      if(!header) return false;
      var st = document.createElement('style');
      st.textContent = '#header-nav-strip::-webkit-scrollbar{display:none;}'
        + '@keyframes navSlideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}';
      document.head.appendChild(st);
      var nav = document.createElement('nav');
      nav.id = 'header-nav-strip';
      nav.setAttribute('aria-label', 'Quick menu');
      nav.style.cssText = 'display:flex;gap:8px;overflow-x:auto;padding:10px 16px;-webkit-overflow-scrolling:touch;scrollbar-width:none;background:rgba(0,0,0,.14);border-top:1px solid rgba(255,255,255,.18);';
      NAV_ITEMS.forEach(function(item){

        b.style.cssText = 'flex-shrink:0;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:8px 14px;font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer;';
        b.onclick = function(){ handleNav(item.action); };
        nav.appendChild(b);
      });
      header.appendChild(nav);
      return true;
    }

    var tries = 0;
    var timer = setInterval(function(){
      if(addHeaderNav()) clearInterval(timer);
      tries++;
      if(tries > 30) clearInterval(timer);
    }, 500);
    if(document.readyState !== 'loading'){ addHeaderNav(); }
    else{ document.addEventListener('DOMContentLoaded', function(){ addHeaderNav(); }); }
  })();
  </script>

       desc:"Voter ID PDF download, EPIC number se, electoral roll status check, mobile number update. NVSP portal integrated service.",

      {icon:"\uD83C\uDFE5", bg:"#fefce8", name:"Ayushman Card Print", badge:null,

       desc:"Farmer ID / AgriStack card download karein. PM Kisan beneficiary details check karein. Farmer registry lookup new digital farmer identity.",
       btn:"Download", url:"https://agristack.gov.in/"},
      {icon:"\uD83C\uDF5A", bg:"#fef2f2", name:"Ration Card Print", badge:null,
       desc:"Bihar EPDS portal se digital ration card download karein. Ration card number se details check, family member list print karein.",
       btn:"Print Now", url:"https://epds.bihar.gov.in/"},

       desc:"Aay praman patra print karein. Domicile certificate, caste certificate, birth certificate sabhi state government certificates.",
       btn:"Print Now", url:"https://serviceonline.gov.in/"}
    ];

    function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

    function renderPrintSection(){
      if(document.getElementById('print-portal-section')) return;
      var anchor = document.querySelector('section[aria-label="Quick links"]');
      if(!anchor) return;
      var sec = document.createElement('section');
      sec.id = 'print-portal-section';
      sec.setAttribute('aria-label','Print portal services');
      var cards = PRINT_SERVICES.map(function(s,i){
        var badge = s.badge ? '<span style="position:absolute;top:10px;right:10px;background:'+s.badgeBg+';color:#fff;font-size:9px;font-weight:800;padding:3px 10px;border-radius:999px;letter-spacing:.5px;">'+s.badge+'</span>' : '';
        var dot = '<span class="pp-status" data-ppurl="'+esc(s.url)+'" title="Checking server..." style="position:absolute;top:12px;left:12px;width:10px;height:10px;border-radius:50%;background:#d1d5db;animation:ppPulse 1.2s infinite;"></span>';
        return '<div style="position:relative;background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:22px 16px 16px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06);display:flex;flex-direction:column;">'
          + badge + dot
          + '<div style="width:56px;height:56px;border-radius:14px;background:'+s.bg+';display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 12px;">'+s.icon+'</div>'
          + '<div style="font-weight:800;font-size:15px;color:#111827;margin-bottom:8px;">'+esc(s.name)+'</div>'
          + '<div style="font-size:12px;color:#6b7280;line-height:1.6;margin-bottom:14px;flex:1;">'+esc(s.desc)+'</div>'
          + '<button data-pp="'+i+'" style="background:none;border:none;color:#2563eb;font-weight:700;font-size:13px;cursor:pointer;padding:6px;">'+esc(s.btn)+'</button>'
          + '</div>';
      }).join('');
      sec.innerHTML =
        '<div style="display:flex;align-items:center;justify-content:space-between;margin:18px 0 4px;">'
        + '<h2 style="font-size:16px;font-weight:800;color:#111827;margin:0;">\uD83D\uDDA8\uFE0F Print Portal Services</h2>'
        + '<button id="pp-recheck" style="background:none;border:none;color:#2563eb;font-size:11px;font-weight:700;cursor:pointer;padding:6px;">\uD83D\uDD04 Recheck</button>'
        + '</div>'
        + '<p style="font-size:11px;color:#6b7280;margin:0 0 12px;"><span id="pp-online-count">Checking servers...</span> \u2014 surakshit login ke baad print/download karein</p>'
        + '<div style="display:grid;grid-template-columns:1fr;gap:12px;" class="pp-grid">'+cards+'</div>';
      var st = document.createElement('style');
      st.textContent = '@media(min-width:640px){.pp-grid{grid-template-columns:repeat(2,1fr)!important;}}'
        + '@media(min-width:1024px){.pp-grid{grid-template-columns:repeat(3,1fr)!important;}}'

        + '@keyframes ppPulse{0%,100%{opacity:1;}50%{opacity:.4;}}';

          if(window.__openPrintService) window.__openPrintService(bi);
        };
      });
    }

    function ppToast(msg, ok){
      var t = document.createElement('div');
      t.style.cssText = 'position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:10005;'
        + 'background:'+(ok?'#16a34a':'#dc2626')+';color:#fff;font-size:13px;font-weight:600;'
        + 'padding:12px 18px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:92vw;text-align:center;';
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(function(){ t.remove(); }, 3500);
    }

    /* ---- DIRECT LINK OPEN (no verification form - direct API connect) ---- */
    window.__openPrintService = function(idx){
      try{
        var svc = PRINT_SERVICES[idx];
        if(!svc) return;
        if(window.__openExternal) window.__openExternal(svc.url);
        else { var a=document.createElement('a'); a.href=svc.url; a.target='_blank'; a.rel='noopener noreferrer'; document.body.appendChild(a); a.click(); setTimeout(function(){ try{a.remove();}catch(e){} },500); }
        ppToast('\u2705 '+svc.name+' khul gaya!', true);
      }catch(e){ console.log(e); }
    };

    /* ---- LIVE SERVER CONNECTION (API status for all 12 services) ---- */
    async function ppPing(url, timeoutMs){
      var ctrl = new AbortController();
      var timer = setTimeout(function(){ try{ctrl.abort();}catch(e){} }, timeoutMs || 8000);
      var start = performance.now();
      try{
        await fetch(url, {method:"HEAD", mode:"no-cors", signal:ctrl.signal, cache:"no-store"});
        clearTimeout(timer);
        return {online:true, ms:Math.round(performance.now()-start)};
      }catch(e){
        clearTimeout(timer);
        return {online:false, ms:Math.round(performance.now()-start)};
      }
    }

    var ppChecking = false;
    async function checkPrintServers(){
      if(ppChecking) return;
      ppChecking = true;
      try{
        var dots = document.querySelectorAll('.pp-status');
        if(!dots.length){ ppChecking = false; return; }
        /* unique URLs only (myaadhaar shared by 2 cards) */
        var seen = {}, jobs = [];
        dots.forEach(function(d){
          var u = d.getAttribute('data-ppurl');
          if(!seen[u]){ seen[u] = true; jobs.push(u); }
        });
        var results = {};
        await Promise.all(jobs.map(async function(u){
          results[u] = await ppPing(u, 8000);
        }));
        var up = 0, total = jobs.length;
        Object.keys(results).forEach(function(u){ if(results[u].online) up++; });
        dots.forEach(function(d){
          var u = d.getAttribute('data-ppurl');
          var r = results[u] || {online:false, ms:0};
          d.style.background = r.online ? '#16a34a' : '#dc2626';
          d.style.animation = 'none';
          d.title = r.online ? ('Online \u2022 ' + r.ms + ' ms') : 'Offline \u2014 server reachable nahi';
        });
        var cnt = document.getElementById('pp-online-count');
        if(cnt) cnt.textContent = up + '/' + total + ' servers online';
        var rb = document.getElementById('pp-recheck');
        if(rb) rb.textContent = '\uD83D\uDD04 Recheck';
      }catch(e){ console.log(e); }
      ppChecking = false;
    }

    /* Render section when page ready */
    var ppTimer = null;
    function init(){
      renderPrintSection();
      if(!document.getElementById('print-portal-section')){ setTimeout(init, 800); return; }
      var rb = document.getElementById('pp-recheck');
      if(rb && !rb.dataset.wired){
        rb.dataset.wired = '1';
        rb.onclick = function(){ rb.textContent = 'Checking...'; checkPrintServers(); };
      }
      checkPrintServers();
      if(!ppTimer) ppTimer = setInterval(checkPrintServers, 60000);
    }
    if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else setTimeout(init, 1200);
  })();
  </script>
